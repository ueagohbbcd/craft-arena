x-restricted: &restricted
  user: 1000:1000
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  init: true
  pids_limit: ${ARENA_PIDS_LIMIT:-256}
  mem_limit: ${ARENA_MEMORY_LIMIT:-2g}
  cpus: ${ARENA_CPU_LIMIT:-2.0}
  restart: 'no'
services:
  minecraft:
    <<: *restricted
    mem_limit: ${MC_MEMORY_LIMIT:-3g}
    # Bridges connect only once the server accepts players (cold start).
    healthcheck:
      test: [CMD, bash, -c, 'echo > /dev/tcp/127.0.0.1/25565']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    image: ${MC_SERVER_IMAGE:-craft-arena-minecraft:local}
    build:
      context: ${MC_SERVER_BUILD_CONTEXT:-../runtime/server}
    stop_grace_period: 180s
    networks:
    - backend
    volumes:
    - world:/data
    - match-results:/results
    - replay-config:/data/config/ServerReplay
  # The participants' only route to a model: forwards to one base URL (an
  # official API or a service on the host) and adds the key there. To let
  # participants reach the model on their own instead, see infra/README.md.
  model-relay:
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    command:
    - node
    - packages/model-relay/cli.mjs
    environment:
      MODEL_RELAY_UPSTREAM: ${MODEL_UPSTREAM_URL:?Provide the model API base URL}
      MODEL_RELAY_API_KEY: ${MODEL_UPSTREAM_KEY:-}
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - red1
    - blue1
    - model-egress
  participant-red1:
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.participant
    environment:
      ARENA_BRIDGE_URL: http://bridge-red1:8080
      ARENA_BRIDGE_TOKEN: ${RED1_BRIDGE_TOKEN}
      OPENAI_BASE_URL: http://model-relay:8080
      ARENA_COST_PER_HOUR: ${MODEL_COST_PER_HOUR:-}
      ARENA_MODEL_CONFIG: /config/model.example.json
      TEAM_GIT_DIR: /team-git
      ARENA_WAIT_FOR_MATCH: '1'
    networks:
    - red1
    volumes:
    - red-work:/workspace
    - red-git:/team-git
    - ./model.example.json:/config/model.example.json:ro
    - ./rules:/arena/rules:ro
    tmpfs:
    - /tmp:rw,nosuid,size=256m
    stdin_open: true
    tty: true
  participant-blue1:
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.participant
    environment:
      ARENA_BRIDGE_URL: http://bridge-blue1:8080
      ARENA_BRIDGE_TOKEN: ${BLUE1_BRIDGE_TOKEN}
      OPENAI_BASE_URL: http://model-relay:8080
      ARENA_COST_PER_HOUR: ${MODEL_COST_PER_HOUR:-}
      ARENA_MODEL_CONFIG: /config/model.example.json
      TEAM_GIT_DIR: /team-git
      ARENA_WAIT_FOR_MATCH: '1'
    networks:
    - blue1
    volumes:
    - blue-work:/workspace
    - blue-git:/team-git
    - ./model.example.json:/config/model.example.json:ro
    - ./rules:/arena/rules:ro
    tmpfs:
    - /tmp:rw,nosuid,size=256m
    stdin_open: true
    tty: true
  bridge-red1:
    # One participant's game bridge: its own container, reachable only from
    # its team network; reads the session from the server over RCON.
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    command:
    - node
    - packages/mf-bridge/cli.mjs
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      MF_HOST: minecraft
      MF_VERSION: ${MC_VERSION:-1.21.1}
      MF_USERNAME: arena_red1
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: '8080'
      BRIDGE_TOKEN: ${RED1_BRIDGE_TOKEN:?Provide scoped operator token}
      BRIDGE_SESSION: server
      BRIDGE_RCON_HOST: minecraft
      BRIDGE_RCON_PASSWORD: ${MC_RCON_PASSWORD:?Provide operator RCON credential}
      BRIDGE_PROMPT_FILE: /config/PROMPT.md
      BRIDGE_WORLD_ID: ${ARENA_WORLD_ID:-arena-world}
      BRIDGE_PARTICIPANT_ID: red1
    networks:
    - backend
    - red1
    volumes:
    - ${ARENA_PROMPT_FILE:-./maps/race-of-wool/PROMPT.md}:/config/PROMPT.md:ro
  bridge-blue1:
    # One participant's game bridge: its own container, reachable only from
    # its team network; reads the session from the server over RCON.
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    command:
    - node
    - packages/mf-bridge/cli.mjs
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      MF_HOST: minecraft
      MF_VERSION: ${MC_VERSION:-1.21.1}
      MF_USERNAME: arena_blue1
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: '8080'
      BRIDGE_TOKEN: ${BLUE1_BRIDGE_TOKEN:?Provide scoped operator token}
      BRIDGE_SESSION: server
      BRIDGE_RCON_HOST: minecraft
      BRIDGE_RCON_PASSWORD: ${MC_RCON_PASSWORD:?Provide operator RCON credential}
      BRIDGE_PROMPT_FILE: /config/PROMPT.md
      BRIDGE_WORLD_ID: ${ARENA_WORLD_ID:-arena-world}
      BRIDGE_PARTICIPANT_ID: blue1
    networks:
    - backend
    - blue1
    volumes:
    - ${ARENA_PROMPT_FILE:-./maps/race-of-wool/PROMPT.md}:/config/PROMPT.md:ro
  # Operator commands for the rules datapack (packages/arena/src/cli.mjs),
  # run on demand: docker compose --profile tools run --rm arena prepare
  # /config/match.json, then start, stop or status. Backend only.
  arena:
    <<: *restricted
    profiles: [tools]
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    entrypoint: [node, packages/arena/src/cli.mjs]
    environment:
      MC_RCON_HOST: minecraft
      MC_RCON_PASSWORD: ${MC_RCON_PASSWORD:?Provide operator RCON credential}
    networks:
    - backend
    volumes:
    - ${ARENA_MATCH_FILE:-./match.live.json}:/config/match.json:ro
networks:
  backend:
    internal: true
  red1:
    internal: true
  blue1:
    internal: true
  model-egress: {}
volumes:
  world: {}
  red-work: {}
  blue-work: {}
  red-git: {}
  blue-git: {}
  match-results: {}
  replay-config: {}
