x-restricted: &restricted
  user: 1000:1000
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  init: true
  pids_limit: ${ARENA_PIDS_LIMIT:-256}
  mem_limit: ${ARENA_MEMORY_LIMIT:-2g}
  cpus: ${ARENA_CPU_LIMIT:-2.0}
  restart: 'no'
services:
  minecraft:
    <<: *restricted
    mem_limit: ${MC_MEMORY_LIMIT:-3g}
    # Bridges connect only once the server accepts players (cold start).
    healthcheck:
      test: [CMD, bash, -c, 'echo > /dev/tcp/127.0.0.1/25565']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    image: ${MC_SERVER_IMAGE:-craft-arena-minecraft:local}
    build:
      context: ${MC_SERVER_BUILD_CONTEXT:-../runtime/server}
    stop_grace_period: 180s
    networks:
    - backend
    volumes:
    - world:/data
    - match-results:/results
    - replay-config:/data/config/ServerReplay
  budget-gateway:
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    command:
    - node
    - packages/budget-gateway/src/cli.mjs
    - /config/budget.json
    environment:
      MODEL_UPSTREAM_KEY: ${MODEL_UPSTREAM_KEY:?Provide upstream credential only to
        gateway}
      RED1_MODEL_TOKEN: ${RED1_MODEL_TOKEN:?Provide scoped operator token}
      BLUE1_MODEL_TOKEN: ${BLUE1_MODEL_TOKEN:?Provide scoped operator token}
      # Read-only: the bridges accept these only for GET /v1/session.
      RED1_STATUS_TOKEN: ${RED1_STATUS_TOKEN:?Provide the read-only status token}
      BLUE1_STATUS_TOKEN: ${BLUE1_STATUS_TOKEN:?Provide the read-only status token}
    volumes:
    - ${BUDGET_CONFIG_PATH:-./budget.cash.live.example.json}:/config/budget.json:ro
    - ./model.example.json:/config/model.example.json:ro
    networks:
    - red1
    - blue1
    - model-egress
  participant-red1:
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.participant
    environment:
      ARENA_BRIDGE_URL: http://bridge-red1:8080
      ARENA_BRIDGE_TOKEN: ${RED1_BRIDGE_TOKEN}
      OPENAI_BASE_URL: http://budget-gateway:8081/participants/red1/v1
      OPENAI_API_KEY: ${RED1_MODEL_TOKEN}
      ARENA_MODEL_CONFIG: /config/model.example.json
      TEAM_GIT_DIR: /team-git
      ARENA_WAIT_FOR_MATCH: '1'
    networks:
    - red1
    volumes:
    - red-work:/workspace
    - red-git:/team-git
    - ./model.example.json:/config/model.example.json:ro
    tmpfs:
    - /tmp:rw,nosuid,size=256m
    stdin_open: true
    tty: true
  participant-blue1:
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.participant
    environment:
      ARENA_BRIDGE_URL: http://bridge-blue1:8080
      ARENA_BRIDGE_TOKEN: ${BLUE1_BRIDGE_TOKEN}
      OPENAI_BASE_URL: http://budget-gateway:8081/participants/blue1/v1
      OPENAI_API_KEY: ${BLUE1_MODEL_TOKEN}
      ARENA_MODEL_CONFIG: /config/model.example.json
      TEAM_GIT_DIR: /team-git
      ARENA_WAIT_FOR_MATCH: '1'
    networks:
    - blue1
    volumes:
    - blue-work:/workspace
    - blue-git:/team-git
    - ./model.example.json:/config/model.example.json:ro
    tmpfs:
    - /tmp:rw,nosuid,size=256m
    stdin_open: true
    tty: true
  bridge-red1:
    # One participant's game bridge: its own container, reachable only from
    # its team network; polls the session from the arena host.
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    command:
    - node
    - packages/mf-bridge/cli.mjs
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      MF_HOST: minecraft
      MF_VERSION: ${MC_VERSION:-1.21.1}
      MF_USERNAME: arena_red1
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: '8080'
      BRIDGE_TOKEN: ${RED1_BRIDGE_TOKEN:?Provide scoped operator token}
      BRIDGE_STATUS_TOKEN: ${RED1_STATUS_TOKEN:?Provide the read-only status token}
      BRIDGE_SESSION: host
      BRIDGE_HOST_URL: http://arena-host:9000/v1/participants/red1/session
      BRIDGE_HOST_TOKEN: ${ARENA_HOST_TOKEN:?Provide the host session token}
      BRIDGE_WORLD_ID: ${ARENA_WORLD_ID:-arena-world}
      BRIDGE_PARTICIPANT_ID: red1
    networks:
    - backend
    - red1
  bridge-blue1:
    # One participant's game bridge: its own container, reachable only from
    # its team network; polls the session from the arena host.
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    command:
    - node
    - packages/mf-bridge/cli.mjs
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      MF_HOST: minecraft
      MF_VERSION: ${MC_VERSION:-1.21.1}
      MF_USERNAME: arena_blue1
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: '8080'
      BRIDGE_TOKEN: ${BLUE1_BRIDGE_TOKEN:?Provide scoped operator token}
      BRIDGE_STATUS_TOKEN: ${BLUE1_STATUS_TOKEN:?Provide the read-only status token}
      BRIDGE_SESSION: host
      BRIDGE_HOST_URL: http://arena-host:9000/v1/participants/blue1/session
      BRIDGE_HOST_TOKEN: ${ARENA_HOST_TOKEN:?Provide the host session token}
      BRIDGE_WORLD_ID: ${ARENA_WORLD_ID:-arena-world}
      BRIDGE_PARTICIPANT_ID: blue1
    networks:
    - backend
    - blue1
  arena-host:
    stop_grace_period: ${ARENA_HOST_STOP_GRACE_PERIOD:-180s}
    <<: *restricted
    build:
      context: ..
      dockerfile: infra/Dockerfile.trusted
    command:
    - node
    - packages/arena/src/live-cli.mjs
    - /config/match.live.json
    - /results/match-result.json
    environment:
      MC_RCON_PASSWORD: ${MC_RCON_PASSWORD:?Provide operator RCON credential}
      ARENA_RUNTIME_FAULT_FILE: /control/runtime-fault.json
      ARENA_HOST_TOKEN: ${ARENA_HOST_TOKEN:?Provide the host session token}
    depends_on: [bridge-red1, bridge-blue1]
    # Backend only: participants reach their own bridge, never the host.
    networks:
    - backend
    volumes:
    - ./match.live.json:/config/match.live.json:ro
    # Mode prompts: briefing.promptFile resolves relative to the config file.
    - ./maps:/config/maps:ro
    - match-results:/results
    - match-control:/control
    - replay-config:/replay-config
networks:
  backend:
    internal: true
  red1:
    internal: true
  blue1:
    internal: true
  model-egress: {}
volumes:
  world: {}
  red-work: {}
  blue-work: {}
  red-git: {}
  blue-git: {}
  match-results: {}
  match-control: {}
  replay-config: {}
