# ARENA_DEPLOYMENT (written to .env by initialize-windows-arena.ps1) names the
# Compose project and tags the images, so deployments never share either.
name: ${ARENA_DEPLOYMENT:-craft-arena-local}
x-common: &common
  user: '1000:1000'
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: ${ARENA_PIDS_LIMIT:-256}
  mem_limit: ${ARENA_MEMORY_LIMIT:-2g}
  cpus: ${ARENA_CPU_LIMIT:-2.0}
  restart: 'no'
services:
  minecraft:
    <<: *common
    build: ./server
    image: craft-arena-minecraft:${ARENA_DEPLOYMENT:-local}
    mem_limit: ${MC_MEMORY_LIMIT:-3g}
    # Login gates connect after the server accepts players (cold start).
    healthcheck:
      test: [CMD, bash, -c, 'echo > /dev/tcp/127.0.0.1/25565']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks: [backend]
    volumes:
      - ./minecraft-data:/data
      - ./results:/results
      - ./replay-config:/data/config/ServerReplay
    stop_grace_period: 180s
  # Login gates, model relays and participant containers are generated per map
  # by `cli.mjs provision` into compose.agents.yaml (one login gate per agent, one
  # participant per agent); scripts/windows-arena.ps1 passes both files.
  # Operator commands for the rules datapack (packages/arena/src/cli.mjs);
  # scripts/windows-arena.ps1 runs it for up, start and stop.
  arena:
    <<: *common
    profiles: [tools]
    image: craft-arena-trusted:${ARENA_DEPLOYMENT:-local}
    entrypoint: [node, packages/arena/src/cli.mjs]
    environment:
      MC_RCON_HOST: minecraft
      MC_RCON_PASSWORD: ${MC_RCON_PASSWORD}
    networks: [backend]
    volumes: ['./match.json:/config/match.json:ro']
networks:
  backend: {internal: true}
