name: craft-arena-local
x-common: &common
  user: '1000:1000'
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: ${ARENA_PIDS_LIMIT:-256}
  mem_limit: ${ARENA_MEMORY_LIMIT:-2g}
  cpus: ${ARENA_CPU_LIMIT:-2.0}
  restart: 'no'
services:
  minecraft:
    <<: *common
    build: ./server
    image: craft-arena-minecraft:local
    mem_limit: ${MC_MEMORY_LIMIT:-3g}
    # Bridges connect only once the server accepts players (cold start).
    healthcheck:
      test: [CMD, bash, -c, 'echo > /dev/tcp/127.0.0.1/25565']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks: [backend]
    volumes:
      - ./minecraft-data:/data
      - ./results:/results
      - ./replay-config:/data/config/ServerReplay
    stop_grace_period: 180s
  bridge-red1:
    # One participant's game bridge, reachable only from its team network.
    <<: *common
    image: craft-arena-trusted:local
    command: [node, packages/mf-bridge/cli.mjs]
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      MF_HOST: minecraft
      MF_VERSION: '1.21.1'
      MF_USERNAME: arena_red1
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: '8080'
      BRIDGE_TOKEN: ${RED1_BRIDGE_TOKEN}
      BRIDGE_SESSION: host
      BRIDGE_HOST_URL: http://arena-host:9000/v1/participants/red1/session
      BRIDGE_HOST_TOKEN: ${ARENA_HOST_TOKEN}
      BRIDGE_WORLD_ID: direct-fire
      BRIDGE_PARTICIPANT_ID: red1
    networks: [backend, red1]
  bridge-blue1:
    # One participant's game bridge, reachable only from its team network.
    <<: *common
    image: craft-arena-trusted:local
    command: [node, packages/mf-bridge/cli.mjs]
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      MF_HOST: minecraft
      MF_VERSION: '1.21.1'
      MF_USERNAME: arena_blue1
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: '8080'
      BRIDGE_TOKEN: ${BLUE1_BRIDGE_TOKEN}
      BRIDGE_SESSION: host
      BRIDGE_HOST_URL: http://arena-host:9000/v1/participants/blue1/session
      BRIDGE_HOST_TOKEN: ${ARENA_HOST_TOKEN}
      BRIDGE_WORLD_ID: direct-fire
      BRIDGE_PARTICIPANT_ID: blue1
    networks: [backend, blue1]
  arena-host:
    <<: *common
    build:
      context: ${ARENA_SOURCE_DIR}
      dockerfile: infra/Dockerfile.trusted
    image: craft-arena-trusted:local
    stop_grace_period: ${ARENA_HOST_STOP_GRACE_PERIOD:-180s}
    command: [node, packages/arena/src/live-cli.mjs, /config/match.live.json, /results/match-result.json]
    environment:
      MC_RCON_PASSWORD: ${MC_RCON_PASSWORD}
      ARENA_RUNTIME_FAULT_FILE: /control/runtime-fault.json
      ARENA_HOST_TOKEN: ${ARENA_HOST_TOKEN}
    depends_on: [bridge-red1, bridge-blue1]
    # Backend only: participants reach their own bridge, never the host.
    networks: [backend]
    volumes:
      - ./match.live.json:/config/match.live.json:ro
      - ./results:/results
      - ./control:/control
      - ./replay-config:/replay-config
  # Each team's model relay forwards to one base URL and adds that team's key:
  # an official API, or any forwarder on this Windows host (for example one that
  # goes through the system proxy) at http://host.docker.internal:PORT/v1.
  model-red:
    <<: *common
    profiles: [agents]
    image: craft-arena-trusted:local
    command: [node, packages/model-relay/cli.mjs]
    environment:
      MODEL_RELAY_UPSTREAM: ${RED_MODEL_URL:-https://api.openai.com/v1}
      MODEL_RELAY_API_KEY: ${RED_MODEL_KEY:-}
    networks: [red1, model-egress]
  model-blue:
    <<: *common
    profiles: [agents]
    image: craft-arena-trusted:local
    command: [node, packages/model-relay/cli.mjs]
    environment:
      MODEL_RELAY_UPSTREAM: ${BLUE_MODEL_URL:-https://api.deepseek.com}
      MODEL_RELAY_API_KEY: ${BLUE_MODEL_KEY:-}
    networks: [blue1, model-egress]
  participant-red1:
    <<: *common
    profiles: [agents]
    build:
      context: ${ARENA_SOURCE_DIR}
      dockerfile: infra/Dockerfile.participant
    image: craft-arena-participant:local
    environment:
      ARENA_BRIDGE_URL: http://bridge-red1:8080
      ARENA_BRIDGE_TOKEN: ${RED1_BRIDGE_TOKEN}
      OPENAI_BASE_URL: http://model-red:8080
      ARENA_MODEL_CONFIG: /config/model.red.json
      TEAM_GIT_DIR: /team-git
      ARENA_WAIT_FOR_MATCH: '1'
      ARENA_START_TIMEOUT_MS: '86400000'
    networks: [red1]
    volumes: [red-work:/workspace, red-git:/team-git, ./model.red.json:/config/model.red.json:ro]
    tmpfs: ['/tmp:rw,nosuid,size=256m']
  participant-blue1:
    <<: *common
    profiles: [agents]
    image: craft-arena-participant:local
    environment:
      ARENA_BRIDGE_URL: http://bridge-blue1:8080
      ARENA_BRIDGE_TOKEN: ${BLUE1_BRIDGE_TOKEN}
      OPENAI_BASE_URL: http://model-blue:8080
      ARENA_MODEL_CONFIG: /config/model.blue.json
      TEAM_GIT_DIR: /team-git
      ARENA_WAIT_FOR_MATCH: '1'
      ARENA_START_TIMEOUT_MS: '86400000'
    networks: [blue1]
    volumes: [blue-work:/workspace, blue-git:/team-git, ./model.blue.json:/config/model.blue.json:ro]
    tmpfs: ['/tmp:rw,nosuid,size=256m']
networks:
  backend: {internal: true}
  red1: {internal: true}
  blue1: {internal: true}
  model-egress: {}
volumes:
  red-work: {}
  blue-work: {}
  red-git: {}
  blue-git: {}

