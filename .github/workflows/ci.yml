name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test

  server-protocol:
    # Real Minecraft 1.21.1 server: protocol v1, the rule datapacks and one
    # live match with two real bots (scripts/verify-server-protocol.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: .cache/minecraft/server.jar
          key: minecraft-server-${{ hashFiles('infra/minecraft-download.json') }}
      - run: npm ci
      - run: npm run verify:server -- --dir .cache/minecraft
